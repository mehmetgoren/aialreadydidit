LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
# Listen on IPv4 and IPv6: the image's health check pings "localhost", which resolves to ::1 first inside the container.
TCPAddr 0.0.0.0
TCPAddr ::
User clamav
StreamMaxLength 1024M
MaxFileSize 1024M
MaxScanSize 2048M
