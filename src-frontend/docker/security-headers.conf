# Security headers shared by every nginx location (nginx drops inherited add_header lines as soon as a location adds
# its own, so each location includes this file instead of repeating the list).
#
# Content-Security-Policy — what the SPA actually loads:
#   script-src   own bundles + Google Identity Services (sign-in button, only when Site:GoogleClientId is set)
#   style-src    own CSS + 'unsafe-inline' (Element Plus and Vue transitions set inline styles; the bot-rendered
#                /seo/app page has an inline <style>) + Google Fonts stylesheet + GSI button styles
#   font-src     Google Fonts files (Outfit) + bundled icon fonts (data: for inlined woff)
#   img-src      own /files screenshots, icons, banners; README images of linked repositories (raw.githubusercontent.com,
#                gitlab.com), Google avatars; blob:/data: for upload previews
#   connect-src  the /api proxy + GSI token endpoint
#   frame-src    the GSI button iframe
#   Everything else falls back to 'self'; plugins are blocked, the page cannot be framed cross-origin, forms and <base>
#   stay on this origin. Presigned MinIO download links are navigations, not fetches, so they need no directive.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
