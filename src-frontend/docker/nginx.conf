# SPA + reverse proxy to the API (compose service "api", port 8080). Crawlers get server-rendered app pages.
# Behind a TLS proxy (Caddy in production) keep the original scheme; standalone, fall back to nginx's own.
map $http_x_forwarded_proto $client_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_user_agent $is_bot {
    default 0;
    ~*(googlebot|bingbot|yandex|duckduckbot|baiduspider|slurp|facebookexternalhit|twitterbot|linkedinbot|slackbot|discordbot|telegrambot|whatsapp|embedly|pinterest|applebot|petalbot|gptbot|claudebot|perplexitybot|ccbot|anthropic-ai|chatgpt-user|bytespider) 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 600m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_scheme;
        proxy_set_header X-Aadi-Client web;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
    }
    location /files/ {
        proxy_pass http://api:8080/files/;
        proxy_cache_valid 200 30d;
    }
    # API docs (Scalar loads its UI from a CDN) and direct SEO/health routes: baseline headers only, no CSP.
    location ~ ^/(openapi|scalar|seo|healthz)/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location = /sitemap.xml { proxy_pass http://api:8080/sitemap.xml; }
    location = /robots.txt { proxy_pass http://api:8080/robots.txt; }
    location = /llms.txt { proxy_pass http://api:8080/llms.txt; }

    # App detail pages: bots receive the server-rendered HTML (meta tags, JSON-LD, full content); humans get the SPA.
    location ~ ^/app/(?<slug>[A-Za-z0-9-]+)$ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        if ($is_bot) { proxy_pass http://api:8080/seo/app/$slug; }
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
        try_files $uri /index.html;
    }

    # Security headers incl. Content-Security-Policy: see docker/security-headers.conf (also included per location).
    include /etc/nginx/security-headers.conf;

    # The SPA shell must always be revalidated, otherwise browsers keep an index.html that points at old hashed bundles.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|svg|png|jpg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }
}
